name: Windows native adapter validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/windows/**'
      - 'ci/prepare-windows.mjs'
      - '.github/workflows/windows-native.yml'
permissions:
  contents: read
jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2022 }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          architecture: ${{ matrix.arch }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - run: node ci/prepare-windows.mjs
      - run: node ci/windows/build-adapter.mjs
      - name: Load generated adapter and official wrapper without account login
        shell: pwsh
        run: |
          Push-Location out/windows-source
          node -e "const n=require('./wrapper.node');if(Object.keys(n).length<80)throw Error('Missing native exports');console.log(JSON.stringify({arch:process.arch,node:process.version,exports:Object.keys(n).length,loaded:true,loginAttempted:false}))"
          if ($LASTEXITCODE -ne 0) { throw 'Native load failed' }
          Pop-Location
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-adapter-${{ matrix.arch }}
          path: |
            out/windows-adapter-build.json
            out/windows-source/manifest.json
          retention-days: 14
