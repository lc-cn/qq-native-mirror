name: Experimental full native object storage
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Complete native release tag (leave both source inputs empty for the frozen historical candidate)
        required: false
        type: string
      source_release_sha256:
        description: Independently verified SHA-256 of exact source release-manifest.json bytes
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  storage-contracts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Run actual filesystem and process-lock fixtures without QQ
        working-directory: sdk
        run: node --test test/native-installed-storage.test.ts test/installed-native.test.ts test/native-package-members.test.ts
  full-inventory-consumer:
    needs: storage-contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            device: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            device: linux-arm64
          - runner: windows-2022
            platform: win32
            arch: x64
            device: win32-x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            device: win32-arm64
          - runner: macos-15
            platform: darwin
            arch: arm64
            device: darwin-arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            device: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          architecture: ${{ matrix.arch }}
      - name: Require actual target
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: node -e "if(process.platform!==process.env.EXPECTED_PLATFORM||process.arch!==process.env.EXPECTED_ARCH||process.version!=='v24.20.0')throw Error('Wrong runner')"
      - name: Linux system dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-xcb1 libgnutls30
      - name: Producer contracts
        run: node --test tools/dedup-native-npm.test.mjs tools/native-storage-plan.test.mjs tools/native-source-identity.test.mjs tools/verify-dedup-consumer.test.mjs
      - name: Require paired source identity inputs
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_RELEASE_SHA256: ${{ inputs.source_release_sha256 }}
        run: |
          node -e "const {SOURCE_TAG:t,SOURCE_RELEASE_SHA256:s}=process.env;if(Boolean(t)!==Boolean(s)|| (t&&(!/^npm-v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?-ci-\d+$/.test(t)||!/^[a-f0-9]{64}$/.test(s))))throw Error('Provide both verified source tag and manifest SHA, or neither')"
      - name: Acquire complete full native source with preserved permanent materials
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag || 'npm-v0.0.2-ci-37962268125' }}
        run: node sdk/scripts/download-npm-candidate.mjs "$SOURCE_TAG" candidate-source
      - name: Pack complete native bytes as deduplicated objects
        env:
          SOURCE_RELEASE_SHA256: ${{ inputs.source_release_sha256 }}
          DEVICE: ${{ matrix.device }}
        run: |
          source_args=()
          if [ -n "$SOURCE_RELEASE_SHA256" ]; then source_args=(--source-release-sha256 "$SOURCE_RELEASE_SHA256"); fi
          node tools/dedup-native-npm.mjs --device "$DEVICE" --source candidate-source --out out "${source_args[@]}"
      - name: Install build dependencies without lifecycle scripts
        working-directory: sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and pack this SDK with the new installed storage loader
        working-directory: sdk
        run: |
          if [ '${{ matrix.platform }}' = 'win32' ]; then npm exec tsc; else npm run build; fi
          npm pack --ignore-scripts --pack-destination ../out --json
      - name: Bind this SDK separately from original native source
        env:
          SOURCE_RELEASE_SHA256: ${{ inputs.source_release_sha256 }}
        run: |
          source_args=()
          if [ -n "$SOURCE_RELEASE_SHA256" ]; then source_args=(--source-release-sha256 "$SOURCE_RELEASE_SHA256"); fi
          node tools/verify-dedup-consumer.mjs --bind-main out "${source_args[@]}"
      - name: Install main only, restore full inventory and run codec without account
        run: node ci/verify-consumer.mjs
      - name: Verify installed full inventory, warm cache, preparation and actual decoding
        env:
          SOURCE_RELEASE_SHA256: ${{ inputs.source_release_sha256 }}
        run: |
          source_args=()
          if [ -n "$SOURCE_RELEASE_SHA256" ]; then source_args=(--source-release-sha256 "$SOURCE_RELEASE_SHA256"); fi
          node tools/verify-dedup-consumer.mjs --verify-consumer out "${source_args[@]}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: experimental-full-object-storage-${{ matrix.device }}
          path: |
            out/qq-native-client-*.tgz
            out/dedup-build.json
            out/native-manifest.json
            out/source-native-manifest.json
            out/source-release-manifest.json
            out/consumer-sdk.json
            out/consumer.json
            out/installed-video.json
            out/dedup-acceptance.json
          retention-days: 14
